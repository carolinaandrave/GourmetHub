<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de producto | Gourmet Hub</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="pagina-administracion">

    <aside class="menu-administracion">
        <a href="inicio-admin.html" class="logo-admin">
            Gourmet Hub
        </a>

        <p class="perfil-admin">Panel de administración</p>

        <nav>
            <ul>
                <li><a href="inicio-admin.html">Inicio</a></li>
                <li><a href="productos-admin.html">Productos</a></li>

                <li>
                    <a href="producto-formulario.html">
                        Nuevo producto
                    </a>
                </li>

                <li><a href="usuarios-admin.html">Usuarios</a></li>

                <li>
                    <a href="usuario-formulario.html">
                        Nuevo usuario
                    </a>
                </li>

                <li><a href="../index.html">Volver a la tienda</a></li>
            </ul>
        </nav>
    </aside>

    <main class="contenido-administracion">

        <header class="encabezado-administracion">
            <div>
                <h1 id="titulo-formulario-producto">
                    Crear producto
                </h1>

                <p>
                    Completa la información del producto.
                </p>
            </div>

            <a href="productos-admin.html" class="boton">
                Volver al listado
            </a>
        </header>

        <section class="contenedor-formulario formulario-admin">

            <form id="formulario-producto" novalidate>

                <input type="hidden" id="producto-id">

                <div class="grupo-formulario">
                    <label for="codigo-producto">
                        Código del producto *
                    </label>

                    <input
                        type="text"
                        id="codigo-producto"
                        minlength="3"
                        placeholder="Ejemplo: PROD004"
                    >

                    <small
                        id="error-codigo-producto"
                        class="mensaje-error">
                    </small>
                </div>

                <div class="grupo-formulario">
                    <label for="nombre-producto">
                        Nombre *
                    </label>

                    <input
                        type="text"
                        id="nombre-producto"
                        maxlength="100"
                        placeholder="Nombre del producto"
                    >

                    <small
                        id="error-nombre-producto"
                        class="mensaje-error">
                    </small>
                </div>

                <div class="grupo-formulario">
                    <label for="descripcion-producto">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion-producto"
                        maxlength="500"
                        rows="5"
                        placeholder="Descripción del producto"
                    ></textarea>

                    <small
                        id="error-descripcion-producto"
                        class="mensaje-error">
                    </small>
                </div>

                <div class="grupo-formulario">
                    <label for="precio-producto">
                        Precio *
                    </label>

                    <input
                        type="number"
                        id="precio-producto"
                        min="0"
                        step="0.01"
                        placeholder="Ejemplo: 12990"
                    >

                    <small
                        id="error-precio-producto"
                        class="mensaje-error">
                    </small>
                </div>

                <div class="grupo-formulario">
                    <label for="stock-producto">
                        Stock *
                    </label>

                    <input
                        type="number"
                        id="stock-producto"
                        min="0"
                        step="1"
                        placeholder="Cantidad disponible"
                    >

                    <small
                        id="error-stock-producto"
                        class="mensaje-error">
                    </small>
                </div>

                <div class="grupo-formulario">
                    <label for="stock-critico-producto">
                        Stock crítico
                    </label>

                    <input
                        type="number"
                        id="stock-critico-producto"
                        min="0"
                        step="1"
                        placeholder="Ejemplo: 5"
                    >

                    <small
                        id="error-stock-critico-producto"
                        class="mensaje-error">
                    </small>
                </div>

                <div class="grupo-formulario">
                    <label for="categoria-producto">
                        Categoría *
                    </label>

                    <select id="categoria-producto">
                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="Aceites">Aceites</option>
                        <option value="Repostería">Repostería</option>
                        <option value="Café">Café</option>
                        <option value="Pastelería">Pastelería</option>
                        <option value="Utensilios">Utensilios</option>
                    </select>

                    <small
                        id="error-categoria-producto"
                        class="mensaje-error">
                    </small>
                </div>

                <div class="grupo-formulario">
                    <label for="imagen-producto">
                        Imagen
                    </label>

                    <input
                        type="file"
                        id="imagen-producto"
                        accept="image/png, image/jpeg"
                    >

                    <p class="sugerencia">
                        La imagen es opcional. Se permiten archivos JPG y PNG.
                    </p>
                </div>

                <button type="submit" class="boton boton-enviar">
                    Guardar producto
                </button>

                <p
                    id="mensaje-formulario-producto"
                    class="mensaje-exito">
                </p>

            </form>

        </section>

    </main>

    <script src="../js/admin-productos.js"></script>
</body>

</html>
